
name: Build NEXUS UF2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli

    steps:
      - name: Checkout NEXUS source
        uses: actions/checkout@v4

      - name: Checkout QMK firmware
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          path: qmk_firmware
          submodules: recursive

      - name: Install NEXUS keyboard
        run: |
          rm -rf qmk_firmware/keyboards/nexus
          mkdir -p qmk_firmware/keyboards/nexus
          cp -a keyboards/nexus/. qmk_firmware/keyboards/nexus/
          mv qmk_firmware/keyboards/nexus/info.json qmk_firmware/keyboards/nexus/keyboard.json

      - name: Compile UF2
        working-directory: qmk_firmware
        run: qmk compile -kb nexus -km default

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-UF2
          path: qmk_firmware/*.uf2
          if-no-files-found: error
